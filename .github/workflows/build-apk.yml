name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cache buildozer .buildozer folder
      - name: Cache Buildozer dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # Cache Android SDK
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: ${{ runner.os }}-androidsdk
          restore-keys: |
            ${{ runner.os }}-androidsdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (system + buildozer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            pkg-config
          pip install --upgrade pip
          pip install cython==3.0.11 buildozer

      - name: Install Android SDK / NDK
        run: |
          if [ ! -d "$HOME/android-sdk" ]; then
            echo "Downloading Android SDK..."
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O sdk.zip
            mkdir -p $HOME/android-sdk/cmdline-tools
            unzip -q sdk.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          fi

          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
            "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.1.8937393"

      - name: Build APK
        run: |
          export ANDROIDSDK="$HOME/android-sdk"
          export ANDROIDNDK="$ANDROIDSDK/ndk/25.1.8937393"
          export PATH=$ANDROIDSDK/platform-tools:$PATH
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
