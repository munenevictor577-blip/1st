name: Build KivyMD APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Cache Buildozer & SDK
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            buildozer-${{ runner.os }}

      - name: Install project dependencies
        run: |
          poetry install

      - name: Install Buildozer
        run: |
          poetry add buildozer

      - name: Build APK (debug)
        run: |
          poetry run buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: kivymd-app-apk
          path: bin/*.apk
